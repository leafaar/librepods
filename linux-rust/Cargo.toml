[package]
name = "librepods"
version = "0.1.0"
edition = "2024"
# Lowest toolchain the crate builds with; aes 0.9 and imageproc 0.27 (via nalgebra) need 1.89.
rust-version = "1.89"

[dependencies]
tokio = {version = "1.53.1", features = ["full"]}
bluer = { version = "0.17.4", features = ["full"] }
uuid = "1.26.1"
dbus = "0.9.12"
hex = "0.4.3"
iced = { version = "0.14.0", features = ["tokio", "image"] }
libpulse-binding = "2.30.1"
ksni = "0.3.6"
image = "0.25.10"
imageproc = "0.27.0"
ab_glyph = "0.2.32"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
aes = "0.9.3"
futures = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# AAC-ELD decode for the hi-res microphone. System libavcodec/libavutil via
# pkg-config (no bundled build); avformat/swscale/etc. are not needed.
ffmpeg-sys-next = { version = "8.1", default-features = false, features = ["avcodec"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 8
panic = "abort"
strip = true
