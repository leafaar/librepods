[package]
name = "librepods"
version = "0.1.0"
edition = "2024"
# Lowest toolchain the crate builds with; aes 0.9 needs 1.89.
rust-version = "1.89"
license = "GPL-3.0-only"
publish = false

[dependencies]
tokio = {version = "1.53.1", features = ["full"]}
bluer = { version = "0.17.4", features = ["full"] }
uuid = "1.26.1"
dbus = "0.9.12"
hex = "0.4.3"
iced = { version = "0.14.0", features = ["tokio", "image"] }
libpulse-binding = "2.30.1"
ksni = "0.3.6"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
aes = "0.9.3"
futures = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# AAC-ELD decode for the hi-res microphone. System libavcodec/libavutil via
# pkg-config (no bundled build); avformat/swscale/etc. are not needed.
ffmpeg-sys-next = { version = "8.1", default-features = false, features = ["avcodec"] }

[lints.rust]
# Edition 2024 only warns; every unsafe operation must sit in its own block
# with its own SAFETY comment.
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Docs and comments are protocol prose full of names (AirPods, AACP, PipeWire,
# BlueZ, MPRIS); backticking every one makes them unreadable.
doc_markdown = "allow"
# Packet bytes, audio samples and UI geometry convert between integer widths and
# floats on purpose; each conversion's range is known where it happens.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
# A binary crate: its errors and panics are not a public API to document.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Names such as AirPodsDevice in module airpods read better than the alternatives.
module_name_repetitions = "allow"
# Signals worth keeping loud:
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 8
panic = "abort"
strip = true
